[package]
name = "kasane-connect"
version = "0.1.0"
edition = "2021"
description = "Kasane Connect: LAN remote control and playback handoff"

[lib]
name = "kasane_connect"
path = "src/lib.rs"

[[bin]]
name = "kasane-connect-cli"
path = "src/bin/kasane-connect-cli.rs"

[dependencies]
tokio = { workspace = true }
tokio-rustls = "=0.26.4"
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rcgen = "=0.14.10"
mdns-sd = "=0.22.0"
if-addrs = "=0.13.4"
sha2 = "=0.10.9"
serde = { workspace = true }
serde_json = { workspace = true }
hex = "=0.4.3"
rand = "=0.9.2"
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
uuid = { version = "=1.18.1", features = ["v4"] }
async-trait = { workspace = true }

[dev-dependencies]
tempfile = "=3.23.0"
