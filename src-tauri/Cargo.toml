[package]
name = "kasane"
version = "0.1.1-alpha"
description = "Kasane music player for Linux"
authors = ["Kasane contributors"]
edition = "2021"

[lib]
name = "kasane_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
kasane-core = { path = "../crates/kasane-core" }
kasane-audio = { path = "../crates/kasane-audio" }
kasane-providers = { path = "../crates/kasane-providers" }
kasane-db = { path = "../crates/kasane-db" }
kasane-connect = { path = "../crates/kasane-connect" }
tauri = { version = "2.2", features = [] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
async-trait.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tauri-plugin-dialog = "2"
keyring = "=4.2.0"
